[project]
name = "hermes-proactive-agent"
version = "0.1.15"
description = "Hermes Agent plugin that runs the chat agent like a secretary with a team of workers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jerry Liu" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["hermes", "hermes-agent", "plugin", "agent", "subagent", "delegation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JerryLiu369/hermes-proactive-agent"
Issues = "https://github.com/JerryLiu369/hermes-proactive-agent/issues"
Releases = "https://github.com/JerryLiu369/hermes-proactive-agent/releases"

[dependency-groups]
dev = ["pytest", "pyyaml", "ruff"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
# Syntax errors and pyflakes checks only; long prompt strings are intentional.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
