[project]
name = "hermes-proactive-agent"
version = "0.1.16"
description = "Hermes Agent plugin that keeps chat turns responsive, briefs and stops subagents, makes sure their results reach the user, and persists delegated tasks across restarts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jerry Liu" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "hermes",
    "hermes-agent",
    "plugin",
    "ai-agent",
    "agent",
    "agent-orchestration",
    "subagent",
    "delegation",
    "multi-agent",
    "task-ledger",
    "background-jobs",
    "agent-governance",
    "chat-agent",
    "llm",
    "llms-txt",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JerryLiu369/hermes-proactive-agent"
Documentation = "https://github.com/JerryLiu369/hermes-proactive-agent#readme"
LLMs = "https://raw.githubusercontent.com/JerryLiu369/hermes-proactive-agent/main/llms.txt"
Issues = "https://github.com/JerryLiu369/hermes-proactive-agent/issues"
Releases = "https://github.com/JerryLiu369/hermes-proactive-agent/releases"

[dependency-groups]
dev = ["pytest", "pyyaml", "ruff"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
# Syntax errors and pyflakes checks only; long prompt strings are intentional.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
