[project]
name = "hermes-super-agent"
version = "0.2.0"
description = "Hermes Agent plugin implementing Lead–Worker Super Agent orchestration: responsive chat coordinator, subagent briefing, anti-loop guards, decision escalation, and persistent SQLite task ledger"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jerry Liu" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "hermes",
    "hermes-agent",
    "hermes-plugin",
    "super-agent",
    "lead-worker",
    "ai-agent",
    "chat-agent",
    "subagents",
    "delegation",
    "multi-agent",
    "agent-orchestration",
    "agent-governance",
    "task-ledger",
    "background-jobs",
    "human-in-the-loop",
    "llms-txt",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JerryLiu369/hermes-super-agent"
Documentation = "https://github.com/JerryLiu369/hermes-super-agent#readme"
LLMs = "https://raw.githubusercontent.com/JerryLiu369/hermes-super-agent/main/llms.txt"
Issues = "https://github.com/JerryLiu369/hermes-super-agent/issues"
Releases = "https://github.com/JerryLiu369/hermes-super-agent/releases"

[dependency-groups]
dev = ["pytest", "pyyaml", "ruff"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
# Syntax errors and pyflakes checks only; long prompt strings are intentional.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
