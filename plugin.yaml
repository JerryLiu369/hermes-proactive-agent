name: proactive-agent
version: "0.1.6"
description: "Proactive agent governor: adaptive 30s terminal detach, 5-turn/90s subagent circuit breaker, positive platform allowlist (weixin by default), and full autonomous subagent & cron bypass."
author: Jerry Liu
license: MIT
hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - pre_api_request
  - agent_loop_stopped
  - on_session_end
  - on_session_reset
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - pre_api_request
  - agent_loop_stopped
  - on_session_end
  - on_session_reset
config_schema:
  governed_platforms:
    type: list
    default: ["weixin"]
    description: "Platforms subject to proactive agent governance (circuit breaker, prompt discipline, 30s terminal detach). Platforms not listed (e.g. cli, desktop) are completely exempt."
  terminal_auto_detach_seconds:
    type: int
    default: 30
    description: "Max seconds a foreground terminal command can run before being detached to the background."
  turn_max_tool_rounds:
    type: int
    default: 5
    description: "Max serial tool rounds in the main agent turn before circuit breaker restricts execution to subagents."
  turn_max_duration_seconds:
    type: number
    default: 90.0
    description: "Max total tool execution duration in the main agent turn before circuit breaker restricts execution to subagents."
