name: proactive-agent
version: "0.1.10"
description: "Runs the Hermes chat agent like a secretary that manages workers: a turn time budget and background detach for the main agent, a handoff check for delegate_task, a step budget and fail-fast for subagents, result notes and progress lines."
author: Jerry Liu
license: MIT
hooks:
  - pre_llm_call
  - pre_api_request
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - subagent_start
  - subagent_stop
  - on_session_end
  - on_session_reset
  - on_session_finalize
provides_hooks:
  - pre_llm_call
  - pre_api_request
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - subagent_start
  - subagent_stop
  - on_session_end
  - on_session_reset
  - on_session_finalize
config_schema:
  governed_platforms:
    type: list
    default: ["weixin"]
    description: "Platforms whose main chat agent (and the subagents it spawns) are governed. Unlisted platforms are untouched."
  terminal_auto_detach_seconds:
    type: int
    default: 30
    description: "Foreground terminal commands running longer than this move to the background (0 disables)."
  turn_soft_seconds:
    type: number
    default: 60.0
    description: "After this many seconds in one turn, the main agent is reminded to answer or delegate."
  turn_hard_seconds:
    type: number
    default: 120.0
    description: "After this many seconds in one turn, only read-only tools and delegate_task stay available."
  handoff_min_context_chars:
    type: int
    default: 120
    description: "delegate_task context shorter than this is returned once per turn."
  handoff_memory_max_chars:
    type: int
    default: 4000
    description: "Max characters of USER.md + MEMORY.md attached to each handoff (0 disables)."
  worker_max_tool_rounds:
    type: int
    default: 60
    description: "Subagent step budget (0 disables). Past it, tool calls are refused and the subagent must report."
  worker_repeat_limit:
    type: int
    default: 5
    description: "Stop a subagent after the same step gives the same result this many times (reminder two repeats earlier)."
  progress_interval_seconds:
    type: int
    default: 300
    description: "Seconds between progress lines in the chat while subagents run (0 disables progress lines and alerts)."
