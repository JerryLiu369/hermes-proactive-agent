name: proactive-agent
version: "0.1.14"
description: "Runs the Hermes chat agent like a secretary with a team of workers: keeps the chat responsive, briefs subagents, stops ones that spin, and checks and records every result in a persistent task ledger."
author: Jerry Liu
license: MIT
homepage: https://github.com/JerryLiu369/hermes-proactive-agent
tags: [delegation, subagents, governance]
requires_hermes: ">=0.22"
provides_hooks:
  - pre_llm_call
  - pre_api_request
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - subagent_start
  - subagent_stop
  - on_session_end
  - on_session_reset
  - on_session_finalize
config_schema:
  governed_platforms:
    type: list
    default: ["weixin"]
    description: "Platforms whose main chat agent (and the subagents it spawns) are governed. Unlisted platforms are untouched."
  terminal_auto_detach_seconds:
    type: int
    default: 30
    description: "Foreground terminal commands running longer than this move to the background (0 disables)."
  turn_soft_seconds:
    type: number
    default: 60.0
    description: "After this many seconds in one turn, the main agent is reminded to answer or delegate."
  turn_hard_seconds:
    type: number
    default: 120.0
    description: "After this many seconds in one turn, editing and execution pause; reading, delegate_task and wrap-up tools stay available."
  handoff_min_context_chars:
    type: int
    default: 120
    description: "delegate_task context shorter than this is returned once per turn."
  worker_repeat_limit:
    type: int
    default: 5
    description: "Stop a subagent after the same step gives the same result this many times (reminder two repeats earlier)."
